name: SFT
options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  SFT:
    type: application
    platform: iOS
    sources:
      - path: SFT
        excludes:
          - SFT.entitlements
    info:
      path: SFT/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthUpdateUsageDescription: "SFT writes your food nutrition data to Apple Health so it stays in sync with your other health metrics."
        NSHealthShareUsageDescription: "SFT reads Health data to avoid duplicate entries."
        NSCameraUsageDescription: "SFT uses the camera to scan barcodes and analyze food photos for nutrition estimates."
        NSPhotoLibraryUsageDescription: "SFT accesses your photo library so you can select a food photo for nutrition analysis."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: SFT/SFT.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dustinschaaf.sft
        PRODUCT_NAME: SFT
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SFT/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
  SFTTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SFTTests
    dependencies:
      - target: SFT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dustinschaaf.sftTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SFT:
    build:
      targets:
        SFT: all
    test:
      targets:
        - name: SFTTests
